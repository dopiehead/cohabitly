[phases.setup]
nixPkgs = ["php84", "php84Packages.composer"]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --ignore-platform-req=ext-redis"
]

[phases.build]
cmds = [
    "php bin/console cache:warmup --env=prod --no-debug --no-interaction 2>/dev/null || true"
]

[start]
cmd = "sh start.sh"
